name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      bundle_node:
        description: "Sertakan runtime Node.js (arm64) di APK"
        type: boolean
        default: true

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan runtime Node.js (aset APK)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.bundle_node }}
        # Gagal di sini TIDAK menggagalkan build: APK tetap jadi (Static Hosting jalan),
        # runtime dapat diimpor manual di Settings > Runtime.
        continue-on-error: true
        run: python3 scripts/fetch-node-runtime.py --out runtime-bundle/assets/node-runtime.zip

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::app-debug.apk tidak dibuat"; ls -R app/build/outputs || true; exit 1; }
          ls -lh "$APK"
          if unzip -l "$APK" | grep -q "assets/node-runtime.zip"; then
            echo "Runtime Node.js: TERSERTAKAN"
          else
            echo "::warning::Runtime Node.js tidak tersertakan di APK (hanya Static Hosting sampai runtime diimpor)"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
